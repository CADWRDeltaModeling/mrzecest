envvar:
  fit_suffix: v1
output_file: fit_version1.csv
so: 100000.
sb: 120.0
filter_setup:
  dt: 3h
  k0: 6
  filter_length: 13
  centering: causal
fit_run:
  start: "2004-06-05"
  end: "2018-01-01"
  solver: powell #L-BFGS-B  #powell
  tol: 5e-3
  outer_params:
    - key: beta_log10
      x0: 10.7
      bounds: [8.0, 12.0]
    - key: npow
      x0: 0.4
      bounds: [0.15, 1.]
    - key: area_coef
      scale: 3600e6
      x0: -0.5
      bounds: [-2, 0]
    - key: energy_coef
      scale: 1000.0
      x0: 0.88
      bounds: [0., 1.25]
